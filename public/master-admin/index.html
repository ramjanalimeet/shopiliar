<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Master admin · Shopilier</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@500;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@500;700&display=swap"></noscript>
  <link rel="stylesheet" href="../assets/dash.css">
  <link rel="stylesheet" href="../assets/admin.css">
</head>
<body data-app-name="Shopilier Master" class="store-admin master-admin">
  <div class="app">
    <aside class="side" aria-label="Master admin navigation">
      <a class="brand" href="/"><img class="brand-mark" src="/assets/logo.webp" width="34" height="34" alt="">Shopilier<small>Admin</small></a>
      <nav class="side-nav">
        <a class="nav-item" data-route="overview" href="#/overview"><span data-icon="home"></span>Overview</a>
        <a class="nav-item" data-route="users" href="#/users"><span data-icon="customers"></span>Users<span class="count" id="count-users"></span></a>
        <a class="nav-item" data-route="messages" href="#/messages"><span data-icon="mail"></span>Messages<span class="count" id="msg-count"></span></a>
        <a class="nav-item" data-route="templates" href="#/templates"><span data-icon="layout"></span>Templates<span class="count" id="count-templates"></span></a>
        <a class="nav-item" data-route="payments" href="#/payments"><span data-icon="money"></span>Payments<span class="count" id="count-due"></span></a>
        <a class="nav-item" data-route="plans" href="#/plans"><span data-icon="tag"></span>Plans &amp; pricing</a>
        <a class="nav-item" data-route="activity" href="#/activity"><span data-icon="clock"></span>Activity</a>
      </nav>
      <div class="side-group">
        <div class="side-head">Shortcuts</div>
        <a class="nav-item" href="/"><span data-icon="globe"></span>Public website</a>
        <a class="nav-item" href="/admin/"><span data-icon="store"></span>User dashboard</a>
      </div>
      <div class="side-foot">
        <a class="nav-item" data-route="settings" href="#/settings"><span data-icon="settings"></span>Settings</a>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="top-icon menu-btn" type="button" aria-label="Open menu"><span data-icon="menu"></span></button>
        <label class="top-search"><span data-icon="search"></span><input id="top-search" type="search" placeholder="Search users, businesses, emails…" aria-label="Search users"></label>
        <span class="demo-badge" title="Master dashboard data is kept in this browser for now">Saved in this browser</span>
        <a class="top-bell" href="#/payments" id="bell" aria-label="Unpaid invoices" title="Unpaid invoices"><span data-icon="bell"></span><span class="badge" id="bell-count"></span></a>
        <div class="profile">
          <button class="profile-btn" type="button" id="profile-btn" aria-haspopup="menu" aria-expanded="false">
            <span class="profile-avatar"><span class="avatar">SA</span></span>
            <span class="profile-text"><b>Shopilier Admin</b><span>Owner · master admin</span></span>
            <span data-icon="chevronDown"></span>
          </button>
          <div class="profile-menu" id="profile-menu" role="menu" hidden>
            <div class="profile-menu-head"><b>Shopilier Admin</b><span>Protected with Cloudflare Access</span></div>
            <a role="menuitem" href="#/settings"><span data-icon="settings"></span>Settings</a>
            <a role="menuitem" href="/"><span data-icon="external"></span>Public website</a>
            <a role="menuitem" href="/admin/"><span data-icon="store"></span>User dashboard</a>
          </div>
        </div>
      </header>
      <div class="scroll"><div id="view"></div></div>
    </div>
  </div>
  <script src="../assets/dash.js"></script>
  <script src="../assets/inbox.js"></script>
  <script src="app.js"></script>
</body>
</html>
