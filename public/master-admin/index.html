<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Master admin · Shopiliar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@500;700&text=%E0%A7%B3&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/dash.css">
</head>
<body data-app-name="Shopiliar Master">
  <div class="app">
    <aside class="side" aria-label="Master admin navigation">
      <a class="brand" href="../index.html"><span class="brand-mark">S</span>Shopiliar<small>Admin</small></a>
      <a class="nav-item" data-route="overview" href="#/overview"><span data-icon="home"></span>Overview</a>
      <a class="nav-item" data-route="users" href="#/users"><span data-icon="customers"></span>Users<span class="count" id="count-users"></span></a>
      <a class="nav-item" data-route="templates" href="#/templates"><span data-icon="layout"></span>Templates<span class="count" id="count-templates"></span></a>
      <a class="nav-item" data-route="payments" href="#/payments"><span data-icon="money"></span>Payments<span class="count" id="count-due"></span></a>
      <a class="nav-item" data-route="plans" href="#/plans"><span data-icon="tag"></span>Plans &amp; pricing</a>
      <div class="side-group">
        <div class="side-label">Platform</div>
        <a class="nav-item" data-route="activity" href="#/activity"><span data-icon="clock"></span>Activity</a>
        <a class="nav-item" data-route="settings" href="#/settings"><span data-icon="settings"></span>Settings</a>
      </div>
      <div class="side-group">
        <div class="side-label">Shortcuts</div>
        <a class="nav-item" href="../index.html"><span data-icon="external"></span>Public website</a>
        <a class="nav-item" href="../admin/"><span data-icon="store"></span>User dashboard</a>
      </div>
      <div class="side-foot">
        <div class="me"><span class="avatar" style="background:#111827">SA</span><div><b>Shopiliar Admin</b><span>Owner</span></div></div>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="top-icon menu-btn" type="button" aria-label="Open menu"><span data-icon="menu"></span></button>
        <div class="crumbs"><span>Shopiliar HQ</span><span class="sep">/</span><b id="crumb">Overview</b></div>
        <label class="top-search"><span data-icon="search"></span><input id="top-search" type="search" placeholder="Search users…" aria-label="Search users"></label>
        <span class="demo-badge" title="Data is saved in this browser until the backend is connected">Saved in this browser</span>
        <a class="top-icon" href="#/payments" id="bell" aria-label="Unpaid invoices" title="Unpaid invoices"><span data-icon="bell"></span></a>
      </header>
      <div class="scroll"><div id="view"></div></div>
    </div>
  </div>
  <script src="../assets/dash.js"></script>
  <script src="app.js"></script>
</body>
</html>
