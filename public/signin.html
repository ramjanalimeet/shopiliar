<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Shopiliar</title>
  <meta name="description" content="Sign in to manage your website.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html"><span class="brand-mark">S</span>Shopiliar</a>
      <nav class="main-nav" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="templates.html">Templates</a>
        <a href="pricing.html">Pricing</a>
      </nav>
      <div class="auth">
        <a class="btn btn-outline" href="signin.html">Sign in</a>
        <a class="btn btn-dark" href="signup.html">Sign up</a>
      </div>
      <button class="menu-toggle" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </header>

  <main class="auth-wrap">
    <form class="auth-card" data-auth="signin">
      <h1>Welcome back</h1>
      <p>Sign in to manage your website.</p>
        <div class="field"><label for="email">Email</label><input id="email" type="email" placeholder="you@business.com" required autocomplete="email"></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" placeholder="••••••••" required autocomplete="current-password"></div>
        <div class="row-between"><label><input type="checkbox" id="remember" checked> Remember me</label></div>
      <button class="btn btn-dark btn-block" type="submit">Sign in</button>
      <p class="form-msg" role="status"></p>
      <p class="auth-foot">Don't have an account? <a class="link" href="signup.html">Sign up</a></p>
    </form>
  </main>

  <script src="assets/main.js"></script>
</body>
</html>
