<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard · Shopilier</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@500;700&text=%E0%A7%B3&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/dash.css">
  <link rel="stylesheet" href="../assets/admin.css">
</head>
<body data-app-name="Shopilier" class="store-admin">
  <div class="app">
    <aside class="side" aria-label="Dashboard navigation">
      <a class="brand" href="/"><img class="brand-mark" src="/assets/logo.webp" width="34" height="34" alt="">Shopilier</a>
      <nav class="side-nav">
        <a class="nav-item" data-route="home" href="#/home"><span data-icon="home"></span>Home</a>
        <a class="nav-item" data-route="orders" href="#/orders"><span data-icon="orders"></span>Orders<span class="count" data-badge></span></a>
        <a class="nav-item" data-route="products" href="#/products"><span data-icon="tag"></span>Products</a>
        <a class="nav-item" data-route="customers" href="#/customers"><span data-icon="customers"></span>Customers</a>
        <a class="nav-item" data-route="analytics" href="#/analytics"><span data-icon="barchart"></span>Analytics</a>
        <a class="nav-item" data-route="marketing" href="#/marketing"><span data-icon="megaphone"></span>Marketing</a>
        <a class="nav-item" data-route="discounts" href="#/discounts"><span data-icon="discount"></span>Discounts</a>
      </nav>
      <div class="side-group">
        <div class="side-head">Sales channel</div>
        <button class="nav-item store-toggle" type="button" id="store-toggle" aria-expanded="false" aria-controls="store-sub"><span data-icon="store"></span>Online Store<span class="caret" data-icon="chevronDown"></span></button>
        <div class="store-sub" id="store-sub" hidden>
          <a class="nav-item sub" data-route="themes" href="#/themes">Themes</a>
          <a class="nav-item sub" data-route="pages" href="#/pages">Pages<span class="count" id="count-pages"></span></a>
          <a class="nav-item sub" data-route="navigation" href="#/navigation">Navigation</a>
          <a class="nav-item sub" data-route="preferences" href="#/preferences">Preferences</a>
        </div>
      </div>
      <div class="side-foot">
        <button class="nav-item" type="button" data-settings="general"><span data-icon="settings"></span>Settings</button>
        <button class="nav-item" type="button" data-settings="billing"><span data-icon="billing"></span>Billing</button>
        <a class="nav-item" data-route="messages" href="#/messages"><span data-icon="mail"></span>Messages<span class="count" id="msg-count"></span></a>
        <a class="nav-item" data-route="help" href="#/help"><span data-icon="help"></span>Help Center</a>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="top-icon menu-btn" type="button" aria-label="Open menu"><span data-icon="menu"></span></button>
        <label class="top-search"><span data-icon="search"></span><input id="top-search" type="search" placeholder="Search products, orders, customers…" aria-label="Search products, orders and customers"></label>
        <a class="top-bell" href="#/orders" id="bell" aria-label="Pending orders" title="Pending orders"><span data-icon="bell"></span><span class="badge" id="bell-count"></span></a>
        <div class="profile">
          <button class="profile-btn" type="button" id="profile-btn" aria-haspopup="menu" aria-expanded="false">
            <span class="profile-avatar" id="me-avatar"></span>
            <span class="profile-text"><b id="me-name">Owner</b><span id="me-store"></span></span>
            <span data-icon="chevronDown"></span>
          </button>
          <div class="profile-menu" id="profile-menu" role="menu" hidden>
            <div class="profile-menu-head"><b id="menu-name"></b><span id="me-email"></span><span class="tag green" id="me-plan"></span></div>
            <a role="menuitem" href="#/themes"><span data-icon="external"></span>My website</a>
            <button role="menuitem" type="button" data-settings="general"><span data-icon="settings"></span>Settings</button>
            <button role="menuitem" type="button" data-settings="billing"><span data-icon="billing"></span>Plan &amp; billing</button>
            <button role="menuitem" type="button" id="logout"><span data-icon="logout"></span>Log out</button>
          </div>
        </div>
      </header>
      <div class="scroll"><div id="view"></div></div>
    </div>
  </div>
  <script src="../assets/dash.js"></script>
  <script src="../assets/password.js"></script>
  <script src="../assets/inbox.js"></script>
  <script src="app.js"></script>
</body>
</html>
