<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up — Shopiliar</title>
  <meta name="description" content="Launch your business website in minutes. No credit card required.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html"><span class="brand-mark">S</span>Shopiliar</a>
      <nav class="main-nav" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="templates.html">Templates</a>
        <a href="pricing.html">Pricing</a>
      </nav>
      <div class="auth">
        <a class="btn btn-outline" href="signin.html">Sign in</a>
        <a class="btn btn-dark" href="signup.html">Sign up</a>
      </div>
      <button class="menu-toggle" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </header>

  <main class="auth-wrap">
    <form class="auth-card" data-auth="signup">
      <span class="picked" data-picked-template hidden></span>
      <h1>Create your account</h1>
      <p>Launch your business website in minutes. No credit card required.</p>
        <div class="field"><label for="name">Full name</label><input id="name" type="text" placeholder="Alex Carter" required autocomplete="name"></div>
        <div class="field"><label for="business">Business name</label><input id="business" type="text" placeholder="Lume Furniture" autocomplete="organization"></div>
        <div class="field"><label for="email">Email</label><input id="email" type="email" placeholder="you@business.com" required autocomplete="email"></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" placeholder="At least 8 characters" minlength="8" required autocomplete="new-password"></div>
      <button class="btn btn-dark btn-block" type="submit">Create account</button>
      <p class="form-msg" role="status"></p>
      <p class="auth-foot">Already have an account? <a class="link" href="signin.html">Sign in</a></p>
    </form>
  </main>

  <script src="assets/main.js"></script>
</body>
</html>
